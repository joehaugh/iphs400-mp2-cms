{% extends "admin/layout.html" %}
{% block body %}
  <h1>{{ title }}</h1>
  <p><a href="/admin/users">Back to Users</a></p>
  {% if error %}<p role="alert"><strong>{{ error }}</strong></p>{% endif %}
  <form method="post" action="{{ '/admin/users/%d' % target.id if target else '/admin/users' }}">
    {{ csrf_field(request) }}
    {% if target %}
    <p>Email: <code>{{ target.email }}</code></p>
    {% else %}
    <p><label>Email <input name="email" type="email" value="{{ values.email }}" required></label></p>
    {% endif %}
    <p><label>Role
      <select name="role">
        <option value="editor" {{ "selected" if values.role == "editor" }}>Editor</option>
        <option value="admin" {{ "selected" if values.role == "admin" }}>Admin</option>
      </select></label></p>
    <p><label>School (Editors only)
      <select name="school_id">
        <option value="">Choose a School…</option>
        {% for s in schools %}
        <option value="{{ s.id }}" {{ "selected" if values.school_id == s.id|string }}>{{ s.name }}</option>
        {% endfor %}
      </select></label></p>
    {% if not target %}
    <p><label>Temporary password <input name="temp_password" type="password" minlength="{{ min_length }}" required autocomplete="new-password">
      <small>The User must choose their own at first sign-in.</small></label></p>
    {% endif %}
    <button type="submit">Save</button>
  </form>
{% endblock %}
