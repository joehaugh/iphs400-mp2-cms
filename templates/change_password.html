{% extends "base.html" %}
{% set home_path = rel(request, "/admin") %}
{% block content %}
  <h1>Choose a new password</h1>
  <p>{{ user.email }}, you must choose your own password before you continue.</p>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/change-password">
    {{ csrf_field(request) }}
    <label>Current (temporary) password <input type="password" name="current_password" required></label>
    <label>New password <input type="password" name="new_password" required minlength="{{ min_length }}"></label>
    <label>Confirm new password <input type="password" name="confirm_password" required minlength="{{ min_length }}"></label>
    <button type="submit">Change password</button>
  </form>
  <form method="post" action="/logout">{{ csrf_field(request) }}<button type="submit">Sign out</button></form>
{% endblock %}
