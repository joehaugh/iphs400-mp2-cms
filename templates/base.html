<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ css_path | default('style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header><a href="{{ home_path | default('index.html') }}">{{ site_title | default(title) }}</a>
  {% if schools_path %}<nav>{% for n in nav or [] %}<a href="{{ n.href }}">{{ n.title }}</a> · {% endfor %}<a href="{{ schools_path }}">Schools</a></nav>{% endif %}</header>
  <main>{% block content %}{% endblock %}</main>
  <footer><small>IPHS 400 Mini-Project #2</small></footer>
</body>
</html>
